<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>K7-YTB-MP3</title>
    <link rel="stylesheet" href="index.css"/>
    <script src="function.js"></script>
  </head>
  <body>

    <div class="content">
      <div class="title">

        <button onclick="minimize()" id="minimize">
          <img src="./asset/-.svg" alt="Close window">
        </button>


        <button onclick="quit()" id="quit">
          <img src="./asset/x.svg" alt="Close window">
        </button>

        
      </div>

      <div class="main-wrapper">
        <div class="main">

          <div class="center">
            <div class="inputwrapper">
              <input type="text" id="url" placeholder="Enter a youtube URL" onchange="resetIcon()" onfocus="resetIcon()" onkeydown="onKeyPressListener(event)">
            </div>

            <div class="bobine">

                <rect x="60.979" y="117.859" width="82.1925" height="6" transform="rotate(-60 60.979 117.859)" fill="#E9C69B"/>
                <path d="M84 68L69 76V92L84 100L99 92V76L84 68Z" fill="#170101"/>
            </svg>

              <svg width="168" height="168" viewBox="0 0 168 168" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M0 84C0 130.392 37.6081 168 84 168C130.392 168 168 130.392 168 84C168 37.6081 130.392 -1.52588e-05 84 -1.52588e-05C37.6081 -1.52588e-05 0 37.6081 0 84Z" fill="#170101"/>
                  <path d="M38 84C38 109.405 58.5949 130 84 130C109.405 130 130 109.405 130 84C130 58.5949 109.405 38 84 38C58.5949 38 38 58.5949 38 84Z" fill="#E9C69B"/>
                  <path d="M47 84C47 104.435 63.5655 121 84 121C104.435 121 121 104.435 121 84C121 63.5655 104.435 47 84 47C63.5655 47 47 63.5655 47 84Z" fill="#170101"/>
                  <path d="M50.5 84C50.5 65.4985 65.4985 50.5 84 50.5C102.502 50.5 117.5 65.4985 117.5 84C117.5 102.502 102.502 117.5 84 117.5C65.4985 117.5 50.5 102.502 50.5 84Z" fill="#E9C69B"/>
                  <path d="M59.5 84C59.5 97.531 70.469 108.5 84 108.5C97.531 108.5 108.5 97.531 108.5 84C108.5 70.469 97.531 59.5 84 59.5C70.469 59.5 59.5 70.469 59.5 84Z" fill="#170101"/>
                  <rect width="83" height="6" transform="matrix(-1 0 0 1 126 81)" fill="#E9C69B"/>
                  <rect width="81.06" height="6" transform="matrix(0.5 0.866025 0.866025 -0.5 61.186 50.5134)" fill="#E9C69B"/>
                  <rect x="60.979" y="117.859" width="82.1925" height="6" transform="rotate(-60 60.979 117.859)" fill="#E9C69B"/>
                  <path d="M84 68L69 76V92L84 100L99 92V76L84 68Z" fill="#170101"/>
              </svg>

              <button onclick="convert()" id="convert">
                <img src="./asset/download.svg" alt="Convert the URL to MP3">
              </button>

              <div id="success" onclick="resetIcon()">
                <img src="./asset/check-circle.svg" alt="Download sucess">
              </div>

              <div id="error" onclick="resetIcon()">
                <img src="./asset/x-32.svg" alt="Download failed">
              </div>


            </div>
          </div>

          <svg width="430" height="175" viewBox="0 0 430 175" fill="none" xmlns="http://www.w3.org/2000/svg">
            <mask id="mask0_50_30" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="430" height="175">

            </mask>
            <g mask="url(#mask0_50_30)">
              <rect y="1" width="430" height="175" fill="#F7D392"/>
              <mask id="mask1_50_30" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="72" width="430" height="103">
                <path d="M0 148.98H430V174.98H0V148.98Z" fill="#2E27E9"/>
                <path d="M0 134.36H430V146.36H0V134.36Z" fill="#2E27E9"/>
                <path d="M0 121.12H430V131.12H0V121.12Z" fill="#2E27E9"/>
                <path d="M0 108.27H430V116.27H0V108.27Z" fill="#2E27E9"/>
                <path d="M0 95.79H430V101.79H0V95.79Z" fill="#2E27E9"/>
                <path d="M0 82.7H430V86.7H0V82.7Z" fill="#2E27E9"/>
                <path d="M0 72H430V74H0V72Z" fill="#2E27E9"/>
              </mask>
              <g mask="url(#mask1_50_30)">
                <circle id="mp3" class="circle show" cx="430" cy="175" fill="#E03F26"/>
                <circle id="mp4" class="circle " cx="430" cy="175" fill="#2E27E9"/>
              </g>
            </g>
          </svg>

          <div class="watermark">
            <h3 class="watermark-tag">K7-YTB-</h3>
            <select name="format-selector" id="format-selector" class="focusable" onchange="selectFormatOnChangeHandler()" onfocus="onFocusHandler(event)">
              <option value="mp3">MP3</option>
              <option value="mp4">MP4</option>
            </select>
          </div>

        </div>
      </div>
      
      <div class="footer">

        <div class="param">

          <h3>Select directory</h3>

          <button onclick="chooseDirectory()" id="btn-choose-file">
            <img src="./asset/folder-plus.svg" alt="Choose a directory where the file will be downloaded">
          </button>
        </div>

        <div class="footer-bar">

          <svg width="286" height="49" viewBox="0 0 286 49" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M49.7585 3.71134C52.4928 1.31877 56.0027 0 59.636 0H226.364C229.997 0 233.507 1.31877 236.242 3.71135L285.37 46.6988C286.283 47.4972 285.718 49 284.505 49V49C284.18 49 283.866 48.8792 283.625 48.6611L236.284 5.8719C233.527 3.37977 229.942 2 226.226 2H59.7743C56.0577 2 52.4734 3.37977 49.7162 5.8719L2.37498 48.6611C2.13363 48.8792 1.81988 49 1.49455 49V49C0.282147 49 -0.282509 47.4972 0.629915 46.6988L49.7585 3.71134Z" fill="#E9C69B"/>
          </svg>

        </div>

        <div class="param">

          <h3>Show Error</h3>

          <label class="switch">
            <input type="checkbox" onchange="setIsErrorShown()" id="switch-show-error">
            <span class="slider"></span>
          </label>
    
        </div>
        
      </div>

    </div>
    

  </body>
</html>
